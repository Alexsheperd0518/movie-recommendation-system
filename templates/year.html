<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Year</title>

    <link rel="stylesheet" type="text/css" href="static\w3-css.css">
    <link rel="icon" type="image/x-icon" href="static\images\favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">

    <style>

        *{
          text-decoration: none;
         }

        .bg-wallpaper{
            background-image: url("static/images/image2.jpg");
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-position: center;
            }

        .font{
            display: flex; 
            font-family: 'Rubik Doodle Shadow',cursive; 
            color: red;
            font-size: 24px;
            }


        /* body color */
        .background1{
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 650px;
            max-width: 100%;
            }


        .background2{
                    background-color: rgba(0, 0, 0, 0.276);
        }


        /* card view */
        #card-view{
            color: white;
            border-radius: 10px;
            border: 1px solid silver;
            padding: 30px 10px;
            background-color: rgba(0, 0, 0, 0.589);
            width: auto;
            }
        

        /* background colors  */
        #card-view-bg{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            }

        /* form */
        #card-view-bg form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: auto;
            margin: 20px;
        }

        /* form button */
        #card-view-bg form button {
            border: 0;
            border-radius: 10px;
            color: white;
            background-color: #E50914;
            height: 48px;
            padding: 16px;
            margin-top: 24px;
            width: 250px;
        }

        /* card */
        .mod2{width: 280px ; height: 400px; border: 1px solid silver; border-radius: 10px; background-color: rgba(0, 0, 0, 0.842);}
        
	    .image{width: 215px; height: 280px; border-radius: 10px; border: 1px solid silver;}

        .hover:hover{transform: scale(0.95);}

    </style>
</head>
<body class="bg-wallpaper">
    
    <!-- Logo and Navigation Bar -->
	<div class="w3-row w3-black" id="top-bar">

		<!-- Logo Section -->
        <div class="w3-col s6 m4 l4 w3-left font" style="margin: 2px 0;">
            <img src="static\images\logo.png" alt="logo" class="w3-round-xlarge" style="height: 40px; margin-top: 4px; margin-right: 10px; margin-left: 10px;">
            <span style="margin-top: 5px;">MovieZephyr</span>
        </div>

		<!-- Navigation Bar for Larger Screens -->
		<div class="w3-col s12 m8 l8 w3-hide-small w3-right" style="margin-top: 2px;">
			<nav class="w3-container w3-right" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px;">

				<a href="http://127.0.0.1:8000"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Home</b></button></a>
				<a href="http://127.0.0.1:8000/year"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Year</b></button></a>
                <a href="http://127.0.0.1:8000/genre"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Genres</b></button></a>
				<a href="http://127.0.0.1:8000/popular"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Popular</b></button></a>
				<a href="http://127.0.0.1:8000/rating"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Rating</b></button></a>

            </nav>
		</div>

		<!-- Hamburger Icon for Small Screens -->
		<div class="w3-col s6 w3-hide-large w3-hide-medium w3-right">
			<button class="w3-button w3-right w3-hover-black" onclick="toggleMenu()">
				&#9776;
			</button>
		</div>

		<!-- Dropdown Menu for Small Screens -->
		<nav id="smallNav" class="w3-col s12 w3-hide w3-hide-medium w3-hide-large">
			<a href="http://127.0.0.1:8000"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Home</b></button></a>
			<a href="http://127.0.0.1:8000/year"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Year</b></button></a>
            <a href="http://127.0.0.1:8000/genre"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Genres</b></button></a>
			<a href="http://127.0.0.1:8000/popular"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Popular</b></button></a>
			<a href="http://127.0.0.1:8000/rating"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Rating</b></button></a>
		</nav>
	</div>
	
	<!-- JavaScript to Toggle Dropdown on Small Screens -->
	<script>
		function toggleMenu() 
		{
			var x = document.getElementById("smallNav");

			if (x.className.indexOf("w3-show") == -1) 
			{
				x.className += " w3-show";
			}

			else 
			{
				x.className = x.className.replace(" w3-show", "");
			}
		}
	</script>
    </div>
    
    <!-- main content -->
    <div style="background-color: rgba(0, 0, 0, 0.797);">
        <div class="background1 w3-right" style="margin-right: 50px;">
            <span><br><br><br><br><br></span> 
            <div id="card-view">
                <div id="card-view-bg">
                    <h1 class="w3-xxlarge w3-center" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 700; text-shadow: 1.5px 1.5px rgb(10, 116, 222);">Explore Movies</h1>
                    
                    <form action="http://127.0.0.1:8000/year" method="POST">
                        
                        <div class="w3-center" style="font-size: 18px; font-weight: 400; margin-bottom: 8px;">Travel Through Time: Find Movies by Year</div>
                        
                        <input type="number" name="select_year" id="movie_list" placeholder="1964 - 2016" class="w3-input w3-round-large" style="height: 60%;" required="/"><br>
                                        
                        <button type="submit" onclick="change_text()" id="recommend_button" value="submit" class="w3-xlarge w3-hover-red" style="margin-top: 5px; padding: 5px;" onclick="change_text()"><a href="#scroller">Start Now</a></button>
                        <p style="font-size: 15px;">(Double tap to see the result)</p>

                        <!-- This script is for print the result -->
                        <script type="text/javascript">
                            function change_text()
                            {
                                document.getElementById("demo").innerHTML="<h1>Recommend Result..</h1>";
                            }
                        </script>

                        <!-- This script is for enter the search movies -->
                        <script>
                            var input = document.getElementById("movie_list");
                            input.addEventListener("keypress", function(event) 
                            {
                                if (event.key === "Enter") 
                                {
                                    event.preventDefault();
                                    document.getElementById("recommend_button").click();
                                }
                            });
                        </script>          
                    </form>         
                </div>
            </div>
        </div>
    </div>
    
   <!-- fetch poster and bottom bar -->
    <div class="w3-container background2">
        <span class="" id="scroller">
            <h2 id="demo"class="w3-text-white"></h2>
        </span>

        <!-- movies poster -->
        <div class="w3-row-padding w3-center" style="margin-left: 65px;">
            {% for i,j in year_wise_movies %}
                <div class="w3-col s12 m6 l3" style="margin-bottom: 20px;">
					<div class="hover mod2">
                        <div class="margin-top" style="margin-top: 25px;">
                            <a href="https://moviesmod.day/" rel="noopener noreferrer"><img src="{{i}}" alt="Not Found" class="image" height="350"></a><br><br>
                        </div>

                        <div class="w3-text-white" style="font-size: 15px; margin: 0px 8px;">
                            <label for="text">{{j}}</label>
                        </div>
                     </div>
                </div>
            {% endfor %}
        </div>

        <!-- bottom button -->
        <div class="w3-right-align">
            <button type="button" class="w3-black w3-round" style="opacity: 0.5"><a href="#top-bar">Go To Top</a></button>
        </div> 
    </div>
    
</body>
</html>
