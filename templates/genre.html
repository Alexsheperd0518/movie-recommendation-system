<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genre</title>

    <link rel="stylesheet" type="text/css" href="static\w3-css.css">
    <link rel="icon" type="image/x-icon" href="static\images\favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">

    <style>

        *{
            text-decoration: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            }

        .font{
            display: flex; 
            font-family: 'Rubik Doodle Shadow',cursive; 
            color: red;
            font-size: 24px;
            }

        /* body color */
        .background1{
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 700px;
            max-width: 100%;
            }

        .background2{
                    background-color: rgba(0, 0, 0, 0.97);
                    margin-top: 20px;
        }
                    
        /* card view */
        #card-view{
            background-color: rgba(0, 0, 0, 0.468);
            color: white;
            border-radius: 10px;
            border: 1px solid silver;
            padding: 40px 0px;
            height: auto;
            width: auto;    
            }
        
        /* background colors  */
        #card-view-bg{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            }

        /* form */
        #card-view-bg form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: auto;
            margin: 15px;
        }

        /* form button */
        #card-view-bg form button {
            border: 0;
            border-radius: 10px;
            color: white;
            background-color: #E50914;
            height: 48px;
            padding: 16px;
            margin-top: 24px;
            width: 250px;
        }

        .back-video
        {
            position: absolute;
            z-index: -1;
            transform: scale(1.3);
        }
        
        @media (min-aspect-ratio:16/9)
        {
            .back-video{
                width: 100%;
                height: auto;
            }
        }

        @media (max-aspect-ratio:16/9)
        {
            .back-video{
                width: auto;
                height: 100%;
            }
        }


        /* card */
        .mod2{width: 280px ; height: 400px; border: 1px solid silver; border-radius: 10px; background-color: rgba(0, 0, 0, 0.842);}
        
	    .image{width: 215px; height: 280px; border-radius: 10px; border: 1px solid silver;}

        .hover:hover{transform: scale(0.95);}

    </style>

</head>
<body>

    <section>
        <video id="video1" autoplay loop muted playsinline class="back-video myslides">
            <source src="static/Videos/clip-1.mp4" type="video/mp4">
        </video>
    
        <!-- <video id="video2" autoplay loop muted playsinline class="back-video myslides">
            <source src="static/Videos/clip-2.mp4" type="video/mp4">
        </video>
    
        <video id="video3" autoplay loop muted playsinline class="back-video myslides">
            <source src="static/Videos/clip-3.mp4" type="video/mp4">
        </video> -->
    </section>
    
    <script>
        // Wait for the DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            // Get the videos
            var video1 = document.getElementById('video1');
            var video2 = document.getElementById('video2');
            var video3 = document.getElementById('video3');
    
            // Play the videos with sound after a short delay
            setTimeout(() => 
            {
                video1.muted = false;
                video1.play();
            }, 300); // Adjust the timeout as necessary to give time for the page to load
    
            // Optionally, you can unmute and play the other videos as well if needed
            // setTimeout(() => {
            //     video2.muted = false;
            //     video2.play();
            // }, 30000); // Adjust as necessary
    
            // setTimeout(() => {
            //     video3.muted = false;
            //     video3.play();
            // }, 60000); // Adjust as necessary
        });
    </script>
      
    <!-- Logo and Navigation Bar -->
	<div class="w3-row w3-black" id="top-bar">

		<!-- Logo Section -->
        <div class="w3-col s6 m4 l4 w3-left font" style="margin: 2px 0;">
            <img src="static\images\logo.png" alt="logo" class="w3-round-xlarge" style="height: 40px; margin-top: 4px; margin-right: 10px; margin-left: 10px;">
            <span style="margin-top: 5px;">MovieZephyr</span>
        </div>

		<!-- Navigation Bar for Larger Screens -->
		<div class="w3-col s12 m8 l8 w3-hide-small w3-right" style="margin-top: 2px;">
			<nav class="w3-container w3-right" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px;">

				<a href="http://127.0.0.1:8000"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Home</b></button></a>
				<a href="http://127.0.0.1:8000/year"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Year</b></button></a>
                <a href="http://127.0.0.1:8000/genre"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Genres</b></button></a>
				<a href="http://127.0.0.1:8000/popular"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Popular</b></button></a>
				<a href="http://127.0.0.1:8000/rating"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Rating</b></button></a>

            </nav>
		</div>

		<!-- Hamburger Icon for Small Screens -->
		<div class="w3-col s6 w3-hide-large w3-hide-medium w3-right">
			<button class="w3-button w3-right w3-hover-black" onclick="toggleMenu()">
				&#9776;
			</button>
		</div>

		<!-- Dropdown Menu for Small Screens -->
		<nav id="smallNav" class="w3-col s12 w3-hide w3-hide-medium w3-hide-large">
			<a href="http://127.0.0.1:8000"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Home</b></button></a>
			<a href="http://127.0.0.1:8000/year"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Year</b></button></a>
            <a href="http://127.0.0.1:8000/genre"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Genres</b></button></a>
			<a href="http://127.0.0.1:8000/popular"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Popular</b></button></a>
			<a href="http://127.0.0.1:8000/rating"><button type="button" class="w3-button w3-hover-black w3-hover-text-blue"><b>Rating</b></button></a>
		</nav>
	</div>
	
	<!-- JavaScript to Toggle Dropdown on Small Screens -->
	<script>
		function toggleMenu() 
		{
			var x = document.getElementById("smallNav");

			if (x.className.indexOf("w3-show") == -1) 
			{
				x.className += " w3-show";
			}

			else 
			{
				x.className = x.className.replace(" w3-show", "");
			}
		}
	</script>

        <!-- main content -->
        <div class="background1">
            <span><br><br><br><br></span>
            <div id="card-view">
                <div id="card-view-bg">
                    <h1 class="w3-xxlarge w3-center" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 700; text-shadow: 1.5px 1.5px rgb(10, 116, 222);">Discover Movies</h1>

                    <form action="http://127.0.0.1:8000/genre" method="POST">
                        
                        <div class="w3-center" style="font-size: 20px; font-weight: 400; margin-bottom: 8px;">Journey Through Genres: Dive Deep into the Films You Love!</div>

                        <select name="genre_name" id="movie_list" class="w3-large w3-round-large" style="font-size: 30px; width: 400px; height: 40px;">
                            {% for x in genre_list%}
                                <option class="w3-large" value="{{x}}">{{x}}</option>
                            {% endfor %}                                              
                        </select><br>
                                            
                        <button type="submit" onclick="change_text()" id="recommend_button" value="submit" class="w3-xlarge w3-hover-red" style="margin-top: 5px; padding: 5px;" onclick="change_text()"><a href="#scroller">Start Now</a></button><p style="font-size: 15px;">(Double tap to see the result)</p>

                          <!-- This script is for print the result -->
                        <script type="text/javascript">
                            function change_text()
                            {
                                document.getElementById("demo").innerHTML="Recommend Result...";
                            }
                        </script>

                        <!-- This script is for enter the search movies -->
                        <script>
                            var input = document.getElementById("movie_list");
                            input.addEventListener("keypress", function(event) 
                            {
                                if (event.key === "Enter") 
                                {
                                    event.preventDefault();
                                    document.getElementById("recommend_button").click();
                                }
                            });
                        </script>          
                    </form>         
                </div>
            </div>
        </div><br><br><br>

        <!-- fetch movies poster and bottom bar -->
        <div class="w3-container background2" id="scroller">
            <span class="background2" id="scroller">
                <h2 id="demo"class="w3-text-white"></h2>
            </span>

            <!-- movies poster -->
            {%if genre == "select-option" %}
            <h2 class="w3-hover-blue w3-text-white w3-hover-text-black w3-round-large w3-center">
                <b>please select the correct movie genre</b>
            </h2>
            {% else %}

            <!-- movies poster -->
            <div class="w3-row-padding w3-center" style="margin-left: 55px;">
                    {% for i,j in movies_genre_poster %}
                        <div class="w3-col s12 m6 l3" style="margin-bottom: 20px;">
					        <div class="hover mod2">
                                <div class="margin-top" style="margin-top: 25px;">
                                    <a href="https://moviesmod.day/" rel="noopener noreferrer"><img src="{{i}}" alt="Not Found" class="image" height="350"></a><br><br>
                                </div>

                                <div class="w3-text-white" style="font-size: 15px; margin: 0px 8px;">
                                    <label for="text">{{j}}</label>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}
            </div> 

            <!-- bottom button -->
            <div class="w3-right-align">
                <button type="button" class="w3-black w3-round" style="opacity: 0.5"><a href="#top-bar">Go To Top</a></button>
            </div> 
        </div>
    
</body>
</html>
